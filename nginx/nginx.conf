events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Важно: resolver нужен чтобы nginx не падал если upstream ещё не поднялся
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting для API (в dev мягче, чем в prod)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Защита от host header injection: только допустимые host'ы
    map $host $allowed_host {
        hostnames;
        default           0;
        localhost         1;
        localhost:8080    1;
        127.0.0.1         1;
        127.0.0.1:8080    1;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 2048M;

        # Должно идти через trustProxies в Laravel
        set_real_ip_from 127.0.0.1;
        real_ip_header   X-Forwarded-For;
        real_ip_recursive on;

        # Host header injection: неизвестный host → 444
        if ($allowed_host = 0) {
            return 444;
        }

        # Базовые security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;

        # API requests → Laravel
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $laravel http://laravel:8000;
            proxy_pass $laravel;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Публичные файлы Laravel (thumbnails и т.п.) — /storage → public/storage
        location /storage/ {
            set $laravel http://laravel:8000;
            proxy_pass $laravel;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sanctum CSRF cookie
        location /sanctum/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $laravel http://laravel:8000;
            proxy_pass $laravel;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else → Next.js
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js hot reload WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
