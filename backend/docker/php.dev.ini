; ─── Отображение ошибок ───────────────────────────────────────────────────────
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; ─── Производительность ───────────────────────────────────────────────────────
; В dev opcache отключаем — иначе изменения в коде не подхватываются сразу
opcache.enable = 0
opcache.enable_cli = 0

; ─── Лимиты ───────────────────────────────────────────────────────────────────
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; ─── Загрузка файлов ──────────────────────────────────────────────────────────
upload_max_filesize = 100M
post_max_size = 100M

; ─── Временная зона ───────────────────────────────────────────────────────────
date.timezone = UTC

; ─── Xdebug (раскомментируй если установлен) ─────────────────────────────────
; zend_extension=xdebug
; xdebug.mode = debug
; xdebug.start_with_request = yes
; xdebug.client_host = host.docker.internal
; xdebug.client_port = 9003
