; ─── Отображение ошибок ───────────────────────────────────────────────────────
; В проде ошибки не показываем пользователю — только логируем
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php/error.log

; ─── Opcache ──────────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0        ; не проверяем изменения файлов — код не меняется
opcache.validate_timestamps = 0
opcache.save_comments = 1          ; нужно для Laravel аннотаций

; ─── Производительность ───────────────────────────────────────────────────────
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ─── Лимиты ───────────────────────────────────────────────────────────────────
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; ─── Загрузка файлов ──────────────────────────────────────────────────────────
upload_max_filesize = 100M
post_max_size = 100M

; ─── Безопасность ─────────────────────────────────────────────────────────────
expose_php = Off                   ; не отдаём версию PHP в заголовках
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On

; ─── Временная зона ───────────────────────────────────────────────────────────
date.timezone = UTC
