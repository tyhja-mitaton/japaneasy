services:
  frontend:
    build:
      context: ./frontend
      target: production          # используем production stage из Dockerfile
      args:
        SITE_URL: ${APP_URL}      # подставляется на этапе сборки (canonical/OG)
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${APP_URL}
      - API_INTERNAL_URL=http://laravel:8000
      - SITE_URL=${APP_URL}
    # Порт НЕ пробрасываем наружу — только через nginx

  laravel:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NLP_SERVICE_URL=http://nlp:8001
      - NLP_SERVICE_TOKEN=${NLP_SERVICE_TOKEN}
      - STRIPE_KEY=${STRIPE_KEY}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}

  nlp:
    build:
      context: ./nlp-service
      target: production
    restart: unless-stopped
    environment:
      - NLP_SERVICE_TOKEN=${NLP_SERVICE_TOKEN}
    # NLP не торчит наружу — только laravel может до него достучаться

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Шаблон — envsubst подставит ${APP_DOMAIN} на старте (nginx официальный образ)
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      # Статика Next.js — nginx отдаёт напрямую, минуя Node
      - frontend_static:/var/www/frontend/.next/static:ro
      - ./ssl:/etc/nginx/ssl:ro           # сертификаты (Let's Encrypt)
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    depends_on:
      - frontend
      - laravel

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      
#  queue-worker:
#    build: ./backend
#    command: php artisan queue:work
#    depends_on:
#      - laravel
#      - redis

volumes:
  postgres_data:
  redis_data:
  frontend_static:
      


