services:
  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules        # не перезаписывать node_modules с хоста
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_INTERNAL_URL=http://laravel:8000
      - SITE_URL=http://localhost:8080
      - NODE_OPTIONS=--max-old-space-size=2560

  laravel:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/php.dev.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - postgres
      - redis
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - NLP_SERVICE_URL=http://nlp:8001

  nlp:
    build:
      context: ./nlp-service
      target: dev
    ports:
      - "8001:8001"
    volumes:
      - ./nlp-service:/app
    environment:
      - LLM_API_KEY=${LLM_API_KEY}

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=japaneseasy
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - laravel
    restart: on-failure          # перезапустится если frontend ещё не готов

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # веб-интерфейс
      - "1025:1025"   # SMTP
  queue-imports:
    build: ./backend
    command: php artisan queue:work database --queue=imports --timeout=600 --memory=512
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres

volumes:
  postgres_data:
  redis_data:
